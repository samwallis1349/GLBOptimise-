<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activate Asset Bench</title>
<style>
  :root { --bg: #0d0d0b; --panel: #171713; --line: #2e2c24; --text: #eeeae0; --muted: #a39d8c; --accent: #ffb547; --error: #ff7a6b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, #2a2112 0%, var(--bg) 60%); color: var(--text); font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
  .card { width: 100%; max-width: 460px; padding: 32px; background: var(--panel); border: 1px solid rgba(255, 181, 71, 0.3); border-radius: 14px; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 600; }
  h1 { margin: 18px 0 6px; font-size: 24px; }
  h1 span { color: var(--accent); }
  p { margin: 0 0 20px; color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
  input { width: 100%; padding: 12px 14px; background: #0d0d0b; border: 1px solid var(--line); border-radius: 8px; color: var(--text); font: 14px ui-monospace, Consolas, monospace; letter-spacing: 0.04em; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 8px; font: 600 15px system-ui, 'Segoe UI', sans-serif; cursor: pointer; }
  .primary { background: var(--accent); color: #1b1407; }
  .primary:disabled { opacity: 0.6; cursor: wait; }
  .secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .error { min-height: 22px; margin: 10px 0 0; color: var(--error); font-size: 14px; }
  .divider { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="6" fill="#1B1B17" stroke="#FFB547" stroke-width="1.5"/>
        <path d="M16 8L23 12V20L16 24L9 20V12L16 8Z M16 16L23 12M16 16L9 12M16 16V24" stroke="#FFB547" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      Asset Bench
    </div>
    <h1>Activate <span id="tool-name">this tool</span></h1>
    <p>Enter the licence key from your receipt email. You only need to be online for this once — after that it works offline on this PC.</p>
    <form id="form">
      <label for="key">Licence key</label>
      <input id="key" autocomplete="off" spellcheck="false" placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX" required>
      <button class="primary" id="activate" type="submit">Activate</button>
      <p class="error" id="error" role="alert"></p>
    </form>
    <p class="divider">Don't have a key yet?</p>
    <button class="secondary" id="buy" type="button">Buy a licence</button>
  </main>
<script>
  const form = document.getElementById('form');
  const input = document.getElementById('key');
  const button = document.getElementById('activate');
  const error = document.getElementById('error');

  window.licence.info().then(({ name }) => {
    document.getElementById('tool-name').textContent = name;
    document.title = `Activate ${name} — Asset Bench`;
  });
  document.getElementById('buy').addEventListener('click', () => window.licence.buy());

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    error.textContent = '';
    button.disabled = true;
    button.textContent = 'Checking…';
    const result = await window.licence.activate(input.value);
    // On success the main process swaps this page for the tool.
    if (!result.ok) {
      error.textContent = result.error;
      button.disabled = false;
      button.textContent = 'Activate';
    }
  });
  input.focus();
</script>
</body>
</html>
