<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reduce polys</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="20" height="20">
    <h1>Reduce <span>Polys</span></h1>
    <span class="free">Free</span>
  </header>

  <section id="keySection" class="key" hidden>
    <p>Reduce Polys is free, but needs an AssetBench API key.</p>
    <button type="button" id="getKey" class="primary">Get a free key</button>
    <details>
      <summary>I already have a key</summary>
      <div class="row">
        <input type="password" id="keyInput" placeholder="abk_live_…" autocomplete="off" spellcheck="false" aria-label="API key">
        <button type="button" id="saveKey">Save</button>
      </div>
    </details>
  </section>

  <section id="main" hidden>
    <label class="drop" id="drop" tabindex="0">
      <input type="file" id="file" accept=".glb,model/gltf-binary" hidden>
      <strong id="fileName">Drop a .glb here</strong>
      <small id="fileHint">or click to choose · up to 25 MB</small>
    </label>

    <label class="field">Keep triangles <b id="keepLabel">30%</b>
      <input type="range" id="keep" min="5" max="95" step="5" value="30">
    </label>
    <label class="check">
      <input type="checkbox" id="acrossSeams">
      <span>Reduce across UV seams<small>For models that barely reduce. Stretches textures.</small></span>
    </label>

    <button type="button" id="run" class="primary" disabled>Reduce</button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
  <div id="result" hidden></div>

  <footer>
    <a href="https://www.assetbench.co.uk/docs/" target="_blank" rel="noopener">API docs</a>
    <button type="button" id="forgetKey" class="link" hidden>Change key</button>
  </footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
