 viewer.configure({...settings,background:'colour'});const solid=await createImageBitmap(await viewer.capture(256));const c=document.createElement('canvas');c.width=c.height=256;const ctx=c.getContext('2d');ctx.drawImage(solid,0,0);assert(ctx.getImageData(0,0,1,1).data[3]===255,'Solid background alpha');solid.close();
 const file=new File([await (await fetch('/hero/downloads/assetbench-colossus-small.glb')).arrayBuffer()],'colossus.glb');

 // A real skinned walk cycle with forward root motion, round-tripped through GLB and the upload loader.

 const geometry=new THREE.CylinderGeometry(.25,.25,2,8,8).translate(0,1,0);const position=geometry.attributes.position,skinIndex=[],skinWeight=[];
 for(let i=0;i<position.count;i++){skinIndex.push(position.getY(i)<1?0:1,0,0,0);skinWeight.push(1,0,0,0);}

   let sum=0,n=0;for(let y=0;y<128;y++)for(let x=0;x<128;x++)if(d[(y*128+x)*4+3]){sum+=x;n++;if(x===0||x===127||y===0||y===127)throw Error('Animated frame touches the edge (clipped)');}
