<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="An AI agent is asked to make robot.glb ready for Unity on mid-range phones; it calls AssetBench and a folder fills with three LODs and Unity import notes">
  <defs>
    <radialGradient id="bgA" cx="74%" cy="38%" r="60%"><stop offset="0" stop-color="#3a1f5c" stop-opacity="0.9"/><stop offset="1" stop-color="#3a1f5c" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgB" cx="16%" cy="28%" r="46%"><stop offset="0" stop-color="#0f4c4a" stop-opacity="0.75"/><stop offset="1" stop-color="#0f4c4a" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb547" stop-opacity="0.4"/><stop offset="0.55" stop-color="#ff7a5c" stop-opacity="0.12"/><stop offset="1" stop-color="#ff7a5c" stop-opacity="0"/></radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151b2b"/><stop offset="1" stop-color="#0b0f19"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#b14cff"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ee0c3" stop-opacity="0"/><stop offset="0.5" stop-color="#7ee0c3"/><stop offset="1" stop-color="#ffb547"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="640" fill="#070a12"/>
  <rect width="1200" height="640" fill="url(#bgA)"/>
  <rect width="1200" height="640" fill="url(#bgB)"/>

  <!-- faint dot grid -->
  <g fill="#7ee0c3" fill-opacity="0.08">
    <circle cx="60" cy="560" r="1.6"/><circle cx="100" cy="560" r="1.6"/><circle cx="140" cy="560" r="1.6"/><circle cx="180" cy="560" r="1.6"/><circle cx="220" cy="560" r="1.6"/><circle cx="260" cy="560" r="1.6"/>
    <circle cx="60" cy="600" r="1.6"/><circle cx="100" cy="600" r="1.6"/><circle cx="140" cy="600" r="1.6"/><circle cx="180" cy="600" r="1.6"/><circle cx="220" cy="600" r="1.6"/><circle cx="260" cy="600" r="1.6"/>
    <circle cx="940" cy="40" r="1.6"/><circle cx="980" cy="40" r="1.6"/><circle cx="1020" cy="40" r="1.6"/><circle cx="1060" cy="40" r="1.6"/><circle cx="1100" cy="40" r="1.6"/><circle cx="1140" cy="40" r="1.6"/>
  </g>

  <!-- agent chat window -->
  <g transform="translate(56 70)">
    <rect width="560" height="420" rx="18" fill="url(#win)" stroke="#2a3350"/>
    <circle cx="26" cy="24" r="6" fill="#ff5f57"/><circle cx="46" cy="24" r="6" fill="#febc2e"/><circle cx="66" cy="24" r="6" fill="#28c840"/>
    <text x="280" y="29" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#7d88a8">your AI agent</text>
    <line x1="0" y1="48" x2="560" y2="48" stroke="#222a42"/>

    <!-- user prompt -->
    <g font-family="Inter, Segoe UI, system-ui, sans-serif">
      <rect x="150" y="70" width="386" height="74" rx="14" fill="#2a2140" stroke="#5b3d8a"/>
      <text x="170" y="100" font-size="17" fill="#efe9ff">Make robot.glb ready for Unity</text>
      <text x="170" y="126" font-size="17" fill="#efe9ff">on mid-range phones, with LODs.</text>
    </g>

    <!-- tool call -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.18;0.92;1" dur="8s" begin="-6s" repeatCount="indefinite"/>
      <rect x="24" y="166" width="420" height="44" rx="10" fill="#101626" stroke="#7ee0c3" stroke-opacity="0.55"/>
      <circle cx="46" cy="188" r="7" fill="none" stroke="#7ee0c3" stroke-width="2.4" stroke-dasharray="30 14">
        <animateTransform attributeName="transform" type="rotate" from="0 46 188" to="360 46 188" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="64" y="194" font-size="15" fill="#7ee0c3">assetbench</text>
      <text x="160" y="194" font-size="15" fill="#c9d2ea">· make_game_ready</text>
    </g>

    <!-- answer -->
    <g font-family="Inter, Segoe UI, system-ui, sans-serif" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.44;0.92;1" dur="8s" begin="-6s" repeatCount="indefinite"/>
      <text x="24" y="250" font-size="17" fill="#e6ebf7">Done. Three LODs for mid-range phones:</text>
      <text x="24" y="282" font-size="17" fill="#e6ebf7"><tspan fill="#ff7a5c" font-weight="700">3,237</tspan> → <tspan fill="#ffb547" font-weight="700">1,391</tspan> → <tspan fill="#7ee0c3" font-weight="700">490</tspan> triangles, saved in</text>
      <text x="24" y="314" font-size="17" fill="#e6ebf7"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#ffb547">robot-mid-unity/</tspan> with Unity import notes.</text>
    </g>

    <!-- input line -->
    <rect x="24" y="358" width="512" height="40" rx="10" fill="#0d1220" stroke="#222a42"/>
    <text x="42" y="384" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5c6788">Ask in plain English…</text>
    <rect x="200" y="368" width="2" height="20" fill="#7ee0c3"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- wire from agent to the folder -->
  <path d="M616 258 C 680 258, 700 300, 760 300" fill="none" stroke="url(#wire)" stroke-width="3" stroke-dasharray="6 8" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- low-poly gem (the model) -->
  <g transform="translate(960 150)">
    <circle r="120" fill="url(#halo)"/>
    <g stroke="#0b0f19" stroke-width="2" stroke-linejoin="round">
      <polygon points="0,-80 -64,-20 0,-6" fill="#ffb547"/>
      <polygon points="0,-80 64,-20 0,-6" fill="#ff7a5c"/>
      <polygon points="-64,-20 0,-6 0,86" fill="#b14cff"/>
      <polygon points="64,-20 0,-6 0,86" fill="#7a3ac0"/>
      <polygon points="-64,-20 -40,30 0,86" fill="#8f4ae0"/>
      <polygon points="64,-20 40,30 0,86" fill="#5c2a96"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="960 150; 960 140; 960 150" dur="4s" repeatCount="indefinite" additive="replace"/>
  </g>

  <!-- output folder -->
  <g transform="translate(760 270)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">
    <rect width="390" height="250" rx="16" fill="url(#win)" stroke="#2a3350"/>
    <path d="M22 22 h30 l8 9 h40 v26 h-78 z" fill="url(#hot)"/>
    <text x="114" y="48" fill="#ffb547" font-weight="700">robot-mid-unity/</text>
    <g fill="#c9d2ea">
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.5;0.92;1" dur="8s" begin="-6s" repeatCount="indefinite"/><text x="40" y="94">├ robot_LOD0.glb</text><text x="300" y="94" fill="#7ee0c3">3.2k ▲</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.56;0.92;1" dur="8s" begin="-6s" repeatCount="indefinite"/><text x="40" y="126">├ robot_LOD1.glb</text><text x="300" y="126" fill="#7ee0c3">1.4k ▲</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.62;0.92;1" dur="8s" begin="-6s" repeatCount="indefinite"/><text x="40" y="158">├ robot_LOD2.glb</text><text x="300" y="158" fill="#7ee0c3">0.5k ▲</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.68;0.92;1" dur="8s" begin="-6s" repeatCount="indefinite"/><text x="40" y="190">├ REPORT.txt</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.74;0.92;1" dur="8s" begin="-6s" repeatCount="indefinite"/><text x="40" y="222">└ IMPORT-UNITY.md</text></g>
    </g>
  </g>

  <!-- works-with strip -->
  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#9aa5c4">
    <text x="56" y="560">Works with</text>
    <g transform="translate(150 541)">
      <rect width="84" height="28" rx="14" fill="#151b2b" stroke="#2a3350"/><text x="42" y="19" text-anchor="middle" fill="#e6ebf7">Claude</text>
      <rect x="94" width="84" height="28" rx="14" fill="#151b2b" stroke="#2a3350"/><text x="136" y="19" text-anchor="middle" fill="#e6ebf7">Cursor</text>
      <rect x="188" width="96" height="28" rx="14" fill="#151b2b" stroke="#2a3350"/><text x="236" y="19" text-anchor="middle" fill="#e6ebf7">VS Code</text>
      <rect x="294" width="150" height="28" rx="14" fill="#151b2b" stroke="#2a3350"/><text x="369" y="19" text-anchor="middle" fill="#e6ebf7">any MCP client</text>
    </g>
  </g>
</svg>
